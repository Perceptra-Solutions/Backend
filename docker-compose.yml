# =====================================================================
# Perceptra — Postgres + backend
#
#   docker compose up -d --build      sobe banco, migra e sobe a API
#   docker compose --profile seed up seed    popula os dados da demo
#   docker compose logs -f api
#   docker compose down -v            apaga tambem o volume do banco
# =====================================================================

name: perceptra

services:
  # -------------------------------------------------------------- banco
  postgres:
    image: postgres:18-alpine
    container_name: perceptra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-perceptra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perceptra}
      POSTGRES_DB: ${POSTGRES_DB:-qualidade_obra}
      # Sem isto o initdb usa a locale do host e a ordenacao de texto muda
      # entre a maquina do dev e a do CI.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      # Exposto para o dev conectar com DBeaver/psql do host. Em producao,
      # remova este mapeamento: so a API precisa alcancar o banco.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      # ATENCAO: a partir do Postgres 18 as imagens oficiais mudaram a
      # convencao. O mount vai em /var/lib/postgresql (nao mais em
      # /var/lib/postgresql/data) e o proprio container cria um
      # subdiretorio por versao maior, para permitir pg_upgrade --link.
      # Montar no caminho antigo faz o container recusar a subir.
      - pgdata:/var/lib/postgresql
    healthcheck:
      # O -d e o -U importam: sem eles o pg_isready responde ok enquanto o
      # initdb ainda esta criando o banco da aplicacao, e a migration
      # quebra com "database does not exist".
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-perceptra} -d ${POSTGRES_DB:-qualidade_obra}']
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  # ---------------------------------------------------------- migracoes
  # Servico efemero: roda as migrations e sai. A API so sobe depois que
  # ele termina com sucesso. Migration NUNCA roda no boot da aplicacao
  # (migrationsRun: false) — subir o app nao pode alterar schema sozinho.
  migracao:
    build:
      context: .
      target: runtime
    image: perceptra-backend:latest
    container_name: perceptra-migracao
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-perceptra}:${POSTGRES_PASSWORD:-perceptra}@postgres:5432/${POSTGRES_DB:-qualidade_obra}
      DATABASE_SSL: 'false'
    command: ['node', 'node_modules/typeorm/cli.js', 'migration:run', '-d', './dist/database/data-source.js']
    restart: 'no'

  # ----------------------------------------------------------------- api
  api:
    build:
      context: .
      target: runtime
    image: perceptra-backend:latest
    container_name: perceptra-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migracao:
        condition: service_completed_successfully
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      APP_NAME: perceptra

      DATABASE_URL: postgresql://${POSTGRES_USER:-perceptra}:${POSTGRES_PASSWORD:-perceptra}@postgres:5432/${POSTGRES_DB:-qualidade_obra}
      DATABASE_SSL: 'false'

      # Obrigatorios: a aplicacao valida no boot e recusa subir sem eles.
      # Definidos no .env da raiz (lido automaticamente pelo compose).
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      BCRYPT_COST: ${BCRYPT_COST:-10}

      CAMERA_URL_STREAM_ENC_KEY: ${CAMERA_URL_STREAM_ENC_KEY:?defina CAMERA_URL_STREAM_ENC_KEY no .env}
      CAMERA_HEARTBEAT_TIMEOUT_SEGUNDOS: ${CAMERA_HEARTBEAT_TIMEOUT_SEGUNDOS:-300}
      DEVICE_API_KEY_PEPPER: ${DEVICE_API_KEY_PEPPER:?defina DEVICE_API_KEY_PEPPER no .env}

      EVIDENCIA_STORAGE_DRIVER: ${EVIDENCIA_STORAGE_DRIVER:-local}
      EVIDENCIA_STORAGE_PATH: /app/storage/evidencias
      EVIDENCIA_TMP_PATH: /app/storage/tmp
      EVIDENCIA_MAX_BYTES: ${EVIDENCIA_MAX_BYTES:-209715200}
      EVIDENCIA_MIME_PERMITIDOS: ${EVIDENCIA_MIME_PERMITIDOS:-image/jpeg,image/png,image/webp,video/mp4,application/pdf}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_URL_TTL_SEGUNDOS: ${S3_URL_TTL_SEGUNDOS:-300}

      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    volumes:
      # Evidencia e prova: nao pode morrer com o container.
      - evidencias:/app/storage

  # ---------------------------------------------------------------- seed
  # Sob profile para nao rodar sozinho: popular a demo e uma decisao, e
  # `--forcar` apaga os dados existentes.
  seed:
    build:
      context: .
      target: runtime
    image: perceptra-backend:latest
    container_name: perceptra-seed
    profiles: ['seed']
    depends_on:
      migracao:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-perceptra}:${POSTGRES_PASSWORD:-perceptra}@postgres:5432/${POSTGRES_DB:-qualidade_obra}
      DATABASE_SSL: 'false'
    command: ['node', 'dist/database/seed.js']
    restart: 'no'

volumes:
  pgdata:
  evidencias:
